<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4b2b" />
            <stop offset="50%" stop-color="#ff416c" />
            <stop offset="100%" stop-color="#ff4b2b" />
        </linearGradient>
        <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <g transform="translate(90, 90)">
        <!-- Vòng sáng đè đúng lên viền 4px của avatar (r=73) -->
        <circle cx="0" cy="0" r="73" fill="none" stroke="url(#glow)" stroke-width="6" stroke-dasharray="100 30 30 30" stroke-linecap="round" filter="url(#blurGlow)">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
        </circle>
        
        <!-- Vòng nhỏ hơn chút bên trong -->
        <circle cx="0" cy="0" r="65" fill="none" stroke="rgba(255, 65, 108, 0.5)" stroke-width="2" stroke-dasharray="25 15" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
        </circle>

        <!-- Lớp sáng lấp lánh (sparkles) trên viền -->
        <circle cx="0" cy="-73" r="3" fill="#fff" filter="url(#blurGlow)">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
            <animate attributeName="r" values="2;5;2" dur="4s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="73" cy="0" r="3" fill="#ffb88c" filter="url(#blurGlow)">
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite" />
            <animate attributeName="r" values="3;6;3" dur="6s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>
